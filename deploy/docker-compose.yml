services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      # 模型权重大且不常变,用只读挂载,不打进镜像
      - ../src:/app/src:ro
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../uploads:/app/uploads
      - ../outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    mem_limit: 1150m
    volumes:
      - ../src:/app/src:ro
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../uploads:/app/uploads
      - ../outputs:/app/outputs
    command: ["rq", "worker", "pcb_jobs", "--url", "redis://redis:6379/0"]
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
